<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!--
    AMH — Glass nav-tile base (empty)
    Frosted-glass squircle with a violet-purple rim glow.
    Center is intentionally EMPTY so a nav/toggle icon can be layered on top.
    Transparent background for drop-in use.
  -->
  <defs>
    <!-- translucent glass body: light scattering top-left -> cooler bottom-right -->
    <linearGradient id="glassBody" x1="24" y1="18" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#c4b5fd" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#7c3aed" stop-opacity="0.10"/>
    </linearGradient>

    <!-- violet rim glow: brighter toward the bottom -->
    <linearGradient id="rimGlow" x1="64" y1="10" x2="64" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#7c3aed" stop-opacity="1"/>
    </linearGradient>

    <!-- inner top-left highlight -->
    <linearGradient id="innerHi" x1="28" y1="20" x2="70" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurFrost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- squircle (clean symmetric rounded square) -->
    <rect id="squircle" x="12" y="12" width="104" height="104" rx="34" ry="34"/>
  </defs>

  <!-- outer violet glow halo -->
  <use href="#squircle" stroke="url(#rimGlow)" stroke-width="3" filter="url(#softGlow)" opacity="0.9"/>

  <!-- frosted glass body -->
  <use href="#squircle" fill="url(#glassBody)"/>
  <use href="#squircle" fill="#ffffff" opacity="0.05" filter="url(#blurFrost)"/>

  <!-- crisp edge -->
  <use href="#squircle" stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="1"/>

  <!-- inner top-left highlight arc -->
  <path d="M22 40 C 24 24 34 16 52 15" stroke="url(#innerHi)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- center intentionally empty: place the nav/toggle icon here (x=64,y=64) -->
</svg>
